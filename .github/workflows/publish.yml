name: Publish

# Publishes to npm whenever main carries a package.json version that is not on
# the registry yet. Release flow: bump `version`, publish the repo as usual, and
# this workflow does the rest. Pushes with an already-published version are a
# no-op, so ordinary commits never publish anything.
#
# Authentication is npm trusted publishing (OIDC): no token secret is stored in
# the repo, and every release ships a provenance attestation. The trusted
# publisher must be configured once on npmjs.com for this repo and workflow
# file name (see the deploy README).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Check whether this version is already published
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new; publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        run: npm test

      - if: steps.check.outputs.publish == 'true'
        run: npm publish

      - if: steps.check.outputs.publish == 'true'
        name: Tag the release
        run: |
          tag="v${{ steps.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"

name: Publish

# Stages a release on npm when run by hand (Actions > Publish > Run workflow)
# on main and package.json carries a version that is not on the registry yet.
# Pushes never publish, and runs with an already-published version are a no-op.
# Release flow: bump `version`, merge to main, run this workflow, then approve
# the staged version on npmjs.com with 2FA; only then is it installable. Do not
# run it again before approving: a staged version still counts as unpublished,
# so the run would stage it twice and fail.
#
# Authentication is npm trusted publishing (OIDC): no token secret is stored in
# the repo, and every release ships a provenance attestation. The trusted
# publisher must be configured once on npmjs.com for this repo and workflow
# file name, and only permits `npm stage publish`.
#
# Only resolvrlabs/resolvr-typescript publishes; the job is skipped in forks.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'resolvrlabs/resolvr-typescript' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing needs npm 11.15.0 or later. Pinned to a major so a new
      # npm major cannot change publishing behaviour unannounced.
      - run: npm install -g npm@11

      - name: Check whether this version is already published
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new; staging"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci

      - if: steps.check.outputs.publish == 'true'
        run: npm test

      - if: steps.check.outputs.publish == 'true'
        run: npm stage publish --provenance

      # Tags the commit that was staged; the version goes live on approval.
      - if: steps.check.outputs.publish == 'true'
        name: Tag the release
        run: |
          tag="v${{ steps.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
